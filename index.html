<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>3D Helmet Hardware Explorer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        html { font-size: 10px; }
        body { margin: 0; font-family: 'Google Sans', sans-serif; background-color: #222; overflow: hidden; touch-action: none; }
        #inner-canvas { width: 100vw; height: 100vh; }

        /* Top Navigation - Responsive */
        .topNavigation {
            position: absolute; top: 15px; left: 50%;
            transform: translateX(-50%); z-index: 12;
            background-color: rgba(237, 228, 218, 0.9); border-radius: 48px;
            padding: 8px 16px; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            width: auto; max-width: 90%;
        }
        .searchLable { font-size: 1.4rem; color: #525458; white-space: nowrap; }
        .dropbtn {
            padding: 6px 12px; background: white; border-radius: 8px;
            border: 1px solid #ddd; cursor: pointer; font-size: 1.3rem; 
            min-width: 140px; width: 100%;
        }

        /* Bottom Navigation - Responsive Stack */
        #bottomnavigation {
            position: absolute; bottom: 20px; width: 100%;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            pointer-events: none;
        }
        .nav-group {
            background-color: rgba(226, 216, 205, 0.9); border-radius: 32px; padding: 6px;
            display: flex; align-items: center; gap: 6px; pointer-events: auto;
            backdrop-filter: blur(5px);
        }
        .arrows {
            width: 42px; height: 42px; border-radius: 50%; border: none;
            background: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .arrows svg { width: 12px; height: 12px; fill: #5F6368; }

        /* Colors & Style Text */
        #colorIcons { display: flex; align-items: center; gap: 10px; margin-left: 5px; }
        .colors { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; }
        .colors.active { border-color: #4f607a; }
        .colorball { width: 16px; height: 16px; border-radius: 50%; }
        #colorText { font-size: 1.4rem; color: #555; width: 110px; margin-left: 5px; font-weight: 500; }

        /* Tablet & Desktop Tweaks */
        @media (min-width: 768px) {
            #bottomnavigation { flex-direction: row; justify-content: center; bottom: 40px; }
            .topNavigation { padding: 12px 20px; top: 20px; }
            .searchLable { font-size: 1.6rem; }
            .dropbtn { font-size: 1.4rem; min-width: 180px; }
            .arrows { width: 48px; height: 48px; }
            .colors { width: 24px; height: 24px; }
            #colorText { font-size: 1.6rem; width: 130px; }
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div class="topNavigation">
    <span class="searchLable">Search: </span>
    <select id="componentDropdown" class="dropbtn">
        <option value="reset">Full Helmet View</option>
        <option value="visor">Front Visor</option>
        <option value="interior">Interior Padding</option>
        <option value="back">Rear Exhaust</option>
        <option value="top">Upper Vents</option>
    </select>
</div>

<div id="inner-canvas"></div>

<div id="bottomnavigation">
    <div class="nav-group">
        <button class="arrows" id="rotateLeft" aria-label="Rotate Left"><svg viewBox="0 0 6 10"><path d="M5.5 0.6L4.3 0.6L0.5 4.4C0.2 4.7 0.2 5.3 0.5 5.6L4.3 9.4C4.6 9.7 5.2 9.7 5.5 9.4C5.8 9.1 5.8 8.6 5.5 8.2L2.3 5L5.5 1.8C5.8 1.4 5.8 0.9 5.5 0.6Z"/></svg></button>
        <button class="arrows" id="rotateRight" aria-label="Rotate Right"><svg viewBox="0 0 6 10"><path d="M0.5 0.6C0.2 0.9 0.2 1.4 0.5 1.8L3.7 5L0.5 8.2C0.2 8.6 0.2 9.1 0.5 9.4C0.8 9.7 1.3 9.7 1.7 9.4L5.5 5.6C5.8 5.3 5.8 4.7 5.5 4.4L1.7 0.6C1.4 0.3 0.8 0.3 0.5 0.6Z"/></svg></button>
        <button class="arrows" id="rotateUp" aria-label="Rotate Up"><svg viewBox="0 0 10 6"><path d="M4.4 0.5L0.6 4.3C0.3 4.6 0.3 5.2 0.6 5.5C0.9 5.8 1.4 5.8 1.8 5.5L5 2.3L8.2 5.5C8.6 5.8 9.1 5.8 9.4 5.5C9.7 5.2 9.7 4.6 9.4 4.3L5.6 0.5C5.3 0.2 4.7 0.2 4.4 0.5Z"/></svg></button>
        <button class="arrows" id="rotateDown" aria-label="Rotate Down"><svg viewBox="0 0 10 6"><path d="M8.2 0.5L5 3.7L1.8 0.5C1.4 0.2 0.9 0.2 0.6 0.5C0.3 0.8 0.3 1.3 0.6 1.7L4.4 5.5C4.7 5.8 5.3 5.8 5.6 5.5L9.4 1.7C9.7 1.3 9.7 0.8 9.4 0.5C9.1 0.2 8.6 0.2 8.2 0.5Z"/></svg></button>
        <button class="arrows" id="zoomButton" aria-label="Zoom">🔍</button>
    </div>

    <div class="nav-group">
        <div id="colorIcons">
            <div class="colors active" data-color="#ffffff" data-name="Original"><div class="colorball" style="background: #ffffff; border: 1px solid #999;"></div></div>
            <div class="colors" data-color="#ff4444" data-name="Crimson"><div class="colorball" style="background: #ff4444;"></div></div>
            <div class="colors" data-color="#44ff44" data-name="Acid Green"><div class="colorball" style="background: #44ff44;"></div></div>
        </div>
        <div id="colorText">Style: Original</div>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

    const scene = new THREE.Scene();
    
    // Adjusted initial camera FOV based on aspect ratio
    const isMobile = window.innerWidth < 768;
    const camera = new THREE.PerspectiveCamera(isMobile ? 55 : 45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, isMobile ? 7 : 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.getElementById('inner-canvas').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    new RGBELoader().load('https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr', (tex) => {
        tex.mapping = THREE.EquirectangularReflectionMapping;
        scene.environment = tex;
    });

    let myModel;
    new GLTFLoader().load('https://threejs.org/examples/models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf', (gltf) => {
        myModel = gltf.scene;
        scene.add(myModel);
    });

    function flyTo(targetPos) {
        controls.enabled = false;
        gsap.to(camera.position, {
            x: targetPos.x, y: targetPos.y, z: targetPos.z,
            duration: 1.5,
            ease: "power3.inOut",
            onUpdate: () => camera.lookAt(0, 0, 0),
            onComplete: () => {
                controls.enabled = true;
                controls.update();
            }
        });
    }

    document.getElementById('componentDropdown').addEventListener('change', (e) => {
        const val = e.target.value;
        const scale = window.innerWidth < 768 ? 1.4 : 1.0; // Zoom out slightly more for mobile views
        const targets = {
            'reset': { x: 0, y: 0, z: 5 * scale },
            'visor': { x: 0, y: 0, z: 2.5 * scale },
            'interior': { x: 0, y: 0, z: -1.5 * scale },
            'back': { x: 0, y: 0.5, z: -4 * scale },
            'top': { x: 0, y: 3 * scale, z: 1 * scale }
        };
        flyTo(targets[val] || targets['reset']);
    });

    function snapRotate(dir) {
        const sphere = new THREE.Spherical().setFromVector3(camera.position);
        const step = Math.PI / 2;
        if (dir === 'left') sphere.theta += step;
        if (dir === 'right') sphere.theta -= step;
        if (dir === 'up') { sphere.theta = 0; sphere.phi = Math.PI / 4; }
        if (dir === 'down') { sphere.theta = 0; sphere.phi = (3 * Math.PI) / 4; }
        sphere.theta = Math.round(sphere.theta / step) * step;
        
        const target = new THREE.Vector3().setFromSpherical(sphere);
        flyTo(target);
    }

    document.getElementById('rotateLeft').onclick = () => snapRotate('left');
    document.getElementById('rotateRight').onclick = () => snapRotate('right');
    document.getElementById('rotateUp').onclick = () => snapRotate('up');
    document.getElementById('rotateDown').onclick = () => snapRotate('down');

    document.querySelectorAll('.colors').forEach(btn => {
        btn.onclick = () => {
            const color = btn.getAttribute('data-color');
            document.querySelectorAll('.colors').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('colorText').innerText = `Style: ${btn.getAttribute('data-name')}`;
            if (myModel) {
                myModel.traverse(c => {
                    if (c.isMesh) {
                        gsap.to(c.material.color, { r: new THREE.Color(color).r, g: new THREE.Color(color).g, b: new THREE.Color(color).b, duration: 0.5 });
                    }
                });
            }
        };
    });

    let isZoomed = false;
    document.getElementById('zoomButton').onclick = () => {
        isZoomed = !isZoomed;
        gsap.to(camera, { fov: isZoomed ? 20 : 45, duration: 1, onUpdate: () => camera.updateProjectionMatrix() });
    };

    window.addEventListener('resize', () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        camera.aspect = width / height;
        
        // Dynamic FOV adjustment for vertical mobile screens
        if (width < 768) {
            camera.fov = 55;
        } else {
            camera.fov = 45;
        }
        
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
